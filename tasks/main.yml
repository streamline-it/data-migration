---
# tasks file for data-migration

- name: include OS specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: import task to install needed package(s)
  when: data_migration_mode == 's'
  ansible.builtin.include_tasks: "{{ ansible_os_family }}_install_pkgs.yml"

- name: ensure needed distination directories are created
  loop:
    "{{ data_migration_destination_dirs }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory

- name: ensure files are migrated (synchronize module)
  when: data_migration_mode == 's'
  loop:
    "{{ data_migration_directories }}"
  ansible.posix.synchronize:
    archive: true
    src: "{{ item['src'] }}"
    dest: "{{ item['dest'] }}"

- name: ensure files are migrated (copy module)
  when: data_migration_mode == 'c'
  loop:
    "{{ data_migration_directories }}"
  ansible.builtin.copy:
    src: "{{ item['src'] }}"
    dest: "{{ item['dest'] }}"
    owner: "{{ item['owner'] }}"
    group: "{{ item['group'] }}"
    remote_src: true

- name: ensure shell script exists
  when: data_migration_mode == "t"
  ansible.builtin.template:
    src: remote_copy_script.sh.j2
    dest: "{{ data_script_destination }}"
    owner: root
    group: wheel
    mode: "0700"

- name: run the backup shell script to migrate the data
  when: data_migration_mode == "t"
  ansible.builtin.command:
    cmd: "./{{ data_script_destination }}"
